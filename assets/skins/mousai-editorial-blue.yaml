# Mousai Workspace · Editorial Blue
# ---------------------------------------------------------------------------
# The brand skin of Mousai Workspace: vintage print blue, paper cream, and
# editorial ink. Dark-authored (`colors`); light terminals get the hand-tuned
# paper overlay in `light_colors` — no generated paired palettes, mirroring the
# upstream palette policy (only human-tuned blocks ship).
#
# This file is the cross-surface source of truth. Install it into the official
# skin discovery location ($HERMES_HOME/skins/, e.g. via
# scripts/install_mousai_skin.py) and the Hermes skin engine themes the CLI,
# the TUI, and the desktop from it. The desktop ALSO always carries the same
# palettes as the bundled `mousai-editorial-blue` plugin (apps/desktop/src/
# plugins/mousai-editorial-blue/), so the brand theme survives restarts and
# backend-independent connections; plugin.test.tsx enforces parity between the
# two. Edit colors here first, then mirror the load-bearing seeds into
# palette.ts.
#
# Schema: hermes_cli/skin_engine.py (SKIN YAML SCHEMA). Only fields the engine
# actually supports are used.

name: mousai-editorial-blue
description: Mousai Workspace — vintage print blue, paper cream, editorial ink

colors:
  # Base surface — deep vintage print blue. The desktop GUI and the TUI status
  # bar derive their palettes from this.
  background: "#152A42"
  status_bar_bg: "#0E1E33"
  voice_status_bg: "#0E1E33"
  completion_menu_bg: "#0E1E33"
  completion_menu_current_bg: "#23405F"
  completion_menu_meta_bg: "#0E1E33"
  completion_menu_meta_current_bg: "#23405F"
  selection_bg: "#2C4A6E"

  # Brand accent — dusty print blue, WCAG AA on the deep blue surface.
  ui_accent: "#85AED6"
  ui_primary: "#85AED6"
  banner_accent: "#85AED6"
  banner_title: "#D9C7A0"

  # Text — warm paper cream.
  ui_text: "#EAE3D2"
  banner_text: "#EAE3D2"
  banner_dim: "#8CA2BC"
  ui_label: "#A9BCD4"

  # Structure — borders carry the editorial "black rules on paper" feel, so
  # they stay clearly visible against both the surface and the terminal pole.
  ui_border: "#3E618F"
  banner_border: "#3E618F"
  input_rule: "#3E618F"
  response_border: "#85AED6"
  session_label: "#D9C7A0"
  session_border: "#5E7896"

  # Semantic status — muted vintage inks.
  ui_ok: "#7FB98A"
  ui_warn: "#D9A962"
  ui_error: "#E38A76"
  ui_tool: "#85AED6"
  ui_thinking: "#8CA2BC"

  # Diffs and syntax — printer's two-color plate.
  diff_added: "#1C3A2C"
  diff_removed: "#42251F"
  diff_added_word: "#93CBA0"
  diff_removed_word: "#E89C8D"
  syntax_string: "#A9C6E4"
  syntax_number: "#D9C7A0"
  syntax_keyword: "#85AED6"
  syntax_comment: "#6E86A3"

  # CLI / TUI chrome.
  prompt: "#EAE3D2"
  shell_dollar: "#85AED6"
  status_bar_text: "#C6D2E0"
  status_bar_strong: "#EAE3D2"
  status_bar_dim: "#7E93AC"
  status_bar_good: "#8FBF9A"
  status_bar_warn: "#D9A962"
  status_bar_bad: "#E08D5B"
  status_bar_critical: "#E06C5E"

# Hand-tuned paper overlay for light terminals: cream stock, black editorial
# ink, print-blue accents. Same keys as `colors`.
light_colors:
  background: "#F4EEE1"
  status_bar_bg: "#EAE2CF"
  voice_status_bg: "#EAE2CF"
  completion_menu_bg: "#EFE9DA"
  completion_menu_current_bg: "#DFD2B6"
  completion_menu_meta_bg: "#EFE9DA"
  completion_menu_meta_current_bg: "#E1D6BD"
  selection_bg: "#D3DFEA"

  ui_accent: "#2E5C8A"
  ui_primary: "#2E5C8A"
  banner_accent: "#2E5C8A"
  banner_title: "#1F3A5C"

  ui_text: "#201E19"
  banner_text: "#201E19"
  banner_dim: "#635D4B"
  ui_label: "#3D5A7A"

  ui_border: "#C9BEA2"
  banner_border: "#C9BEA2"
  input_rule: "#2E5C8A"
  response_border: "#2E5C8A"
  session_label: "#1F3A5C"
  session_border: "#A99F85"

  ui_ok: "#2F6B40"
  ui_warn: "#8A6022"
  ui_error: "#A63A2B"
  ui_tool: "#2E5C8A"
  ui_thinking: "#635D4B"

  diff_added: "#DEEBDF"
  diff_removed: "#F2DEDA"
  diff_added_word: "#1F6B36"
  diff_removed_word: "#A02D1F"
  syntax_string: "#8A5A2E"
  syntax_number: "#8A5A2E"
  syntax_keyword: "#2E5C8A"
  syntax_comment: "#8A8272"

  prompt: "#201E19"
  shell_dollar: "#2E5C8A"
  status_bar_text: "#5C5644"
  status_bar_strong: "#1F3A5C"
  status_bar_dim: "#8C8570"
  status_bar_good: "#2F6B40"
  status_bar_warn: "#8A6022"
  status_bar_bad: "#B4541F"
  status_bar_critical: "#A62F1F"

# Branding — printer's ornaments over Hermes' slots. Bare prompt token; the
# renderers add the trailing space.
branding:
  agent_name: "Mousai Workspace"
  welcome: "Welcome to Mousai Workspace. Type your message or /help for commands."
  goodbye: "Goodbye! ❦"
  response_label: " ❦ Mousai "
  prompt_symbol: "❯"
  help_header: "❦ Available Commands"

# Spinner — typographic ornaments; verbs in the editorial register.
spinner:
  waiting_faces:
    - "(❦)"
    - "(✦)"
    - "(❧)"
    - "(✧)"
  thinking_faces:
    - "(✎)"
    - "(❋)"
    - "(✥)"
  thinking_verbs:
    - "composing"
    - "setting type"
    - "proofing"
    - "inking"
    - "margin notes"

tool_prefix: "┊"
